[project]
name = "cianci-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django==5.2.18",
  "djangorestframework==3.16.1",
  "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = ["ruff==0.17.2"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
